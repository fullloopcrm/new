name: CI

# The machine enforces the gates so no single dev can merge a regression:
# type errors, failing tests, or a NEW cross-tenant query all block the PR.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: platform

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the ledger-sync check below computes a merge-base
          # against origin/main, which a shallow (depth-1) checkout can't do
          # (git has no shared history to find "no merge base" errors).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit --pretty false

      - name: Unit tests (vitest, with coverage)
        # --coverage also produces coverage/coverage-summary.json, consumed by the
        # doc-currency check below — one full-suite run does both jobs instead of two.
        run: npx vitest run --coverage

      - name: Tenant-isolation guard
        # Fails if a NEW tenant-owned query is added without .eq('tenant_id', …).
        # The 91 baselined legacy candidates are triaged separately; new leaks can't merge.
        run: node scripts/audit-tenant-scope.mjs

      - name: Readiness ledger sync
        # Fails if a PR touches a file listed in a ledger checkpoint's
        # depends_on_files without updating that checkpoint in the same PR.
        run: node scripts/check-ledger-sync.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Readiness ledger evidence
        # Fails if any checkpoint's score exceeds its evidence_type's cap.
        run: node scripts/validate-ledger-evidence.mjs

      - name: Readiness taxonomy sign-off
        # Fails if taxonomy.json (checkpoint definitions/severity/weights)
        # changed without a new approved_note -- editing what's measured is
        # a distinct, visible action from scoring it.
        run: node scripts/check-taxonomy-signoff.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: TEAM-READINESS.md doc-currency check
        # Fails if docs/TEAM-READINESS.md's stated test-file-count or coverage %
        # has drifted from what the repo actually measures (see script header —
        # this doc's own coverage claim was found silently stale by 800+ test
        # files before this gate existed).
        run: node scripts/check-team-readiness-currency.mjs

      - name: Lint
        # Blocking: `eslint src --quiet` is error-clean today (verified 2026-07-04),
        # so this catches any NEW eslint error. Warnings are suppressed by --quiet.
        run: npx eslint src --quiet

  notify-failure:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Telegram alert on CI failure
        working-directory: ${{ github.workspace }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping alert."
            exit 0
          fi
          TEXT="❌ CI failed — ${{ github.workflow }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="$TEXT" \
            -d disable_web_page_preview=true >/dev/null || true
