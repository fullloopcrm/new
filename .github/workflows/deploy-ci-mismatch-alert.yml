name: Alert on deploy with non-green CI

# Vercel's git integration deploys any [deploy]-tagged commit pushed to main
# regardless of this repo's own CI status — that's how a commit with failing
# CI reached production before (see Phase 0 post-audit item 4, 2026-07-29).
# Changing the Vercel deploy trigger itself is real blast radius (it's the
# live, relied-on mechanism), so this is the lower-risk alternative: watch
# every production deployment and alert loudly if it shipped on top of a
# commit whose CI run wasn't green.

on:
  deployment_status:

permissions:
  actions: read
  deployments: read

jobs:
  check-ci-status:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Look up CI conclusion for the deployed commit
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name=="verify")][0].conclusion // "no_run_found"')
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "CI conclusion for $SHA: $CONCLUSION"

      - name: Alert if the deploy shipped on non-green CI
        if: steps.ci.outputs.conclusion != 'success'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA: ${{ github.event.deployment.sha }}
          CONCLUSION: ${{ steps.ci.outputs.conclusion }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping alert."
            exit 0
          fi
          TEXT="🚨 Production deploy shipped with non-green CI
          commit: ${SHA}
          CI conclusion: ${CONCLUSION}
          deploy: ${{ github.event.deployment_status.target_url }}
          ${{ github.server_url }}/${{ github.repository }}/commit/${SHA}/checks"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="$TEXT" \
            -d disable_web_page_preview=true >/dev/null || true
